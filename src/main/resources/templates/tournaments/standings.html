<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="'Classifica — ' + ${tournament.name}">Classifica</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span th:if="${userDetails}">
            <span class="nav-username" th:text="${userDetails.username}"></span>
            <span sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
            </span>
            <form th:action="@{/logout}" method="POST">
                <button type="submit" class="btn btn-sm">Logout</button>
            </form>
        </span>
        <span th:unless="${userDetails}">
            <a th:href="@{/login}" class="btn btn-sm btn-secondary">Accedi</a>
            <a th:href="@{/register}" class="btn btn-sm btn-primary">Registrati</a>
        </span>
    </div>
</nav>

<div class="container">

    <a th:href="@{/tournaments/{id}(id=${tournament.id})}"
       class="text-muted" style="font-size: 12px;">← Torna al torneo</a>
    <h1 style="margin-top: 0.25rem;" th:text="'Classifica — ' + ${tournament.name}"></h1>

    <div class="section-label">Classifica generale</div>

    <div id="root" th:attr="data-tournament-id=${tournament.id}"></div>

</div>

<script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    function StandingsTable() {
        const [standings, setStandings] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            const tournamentId = document.getElementById("root")
                .getAttribute("data-tournament-id");
            fetch(`/api/tournaments/${tournamentId}/standings`)
                .then(res => res.json())
                .then(data => {
                    setStandings(data);
                    setLoading(false);
                })
                .catch(() => setLoading(false));
        }, []);

        if (loading) return <p className="text-muted">Caricamento classifica...</p>;
        if (standings.length === 0) return <p className="text-muted">Nessuna partita giocata ancora.</p>;

        const rankClass = (index) => {
            if (index === 0) return "rank-gold";
            if (index === 1) return "rank-silver";
            if (index === 2) return "rank-bronze";
            return "";
        };

        const dr = (val) => val > 0 ? "+" + val : val;

        return (
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Squadra</th>
                    <th title="Partite giocate">P</th>
                    <th title="Vittorie">V</th>
                    <th title="Pareggi">N</th>
                    <th title="Sconfitte">S</th>
                    <th title="Gol fatti">GF</th>
                    <th title="Gol subiti">GS</th>
                    <th title="Differenza reti">DR</th>
                    <th title="Punti">Pts</th>
                </tr>
                </thead>
                <tbody>
                {standings.map((row, index) => (
                    <tr key={index} className={rankClass(index)}>
                        <td>{index + 1}</td>
                        <td><strong>{row.teamName}</strong></td>
                        <td>{row.played}</td>
                        <td>{row.wins}</td>
                        <td>{row.draws}</td>
                        <td>{row.losses}</td>
                        <td>{row.goalsFor}</td>
                        <td>{row.goalsAgainst}</td>
                        <td>{dr(row.goalDifference)}</td>
                        <td><strong>{row.points}</strong></td>
                    </tr>
                ))}
                </tbody>
            </table>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<StandingsTable />);
</script>

</body>
</html>
