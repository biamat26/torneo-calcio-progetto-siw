<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Tornei</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span th:if="${userDetails}">
            <span class="nav-username" th:text="${userDetails.username}"></span>
            <span sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
            </span>
            <form th:action="@{/logout}" method="POST">
                <button type="submit" class="btn btn-sm">Logout</button>
            </form>
        </span>
        <span th:unless="${userDetails}">
            <a th:href="@{/login}" class="btn btn-sm btn-secondary">Accedi</a>
            <a th:href="@{/register}" class="btn btn-sm btn-primary">Registrati</a>
        </span>
    </div>
</nav>

<div class="container">
    <div class="flex justify-between mb-2">
        <h1 style="margin-bottom: 0;">Tornei del momento</h1>
        <span sec:authorize="hasAuthority('ADMIN')">
            <a th:href="@{/admin/tournaments/new}" class="btn btn-primary">+ Nuovo torneo</a>
        </span>
    </div>
    <div class="tournament-card-grid">
        <div th:each="tournament : ${tournaments}" class="tournament-card">
            <div class="tournament-card-img">
                <img th:if="${tournament.imageUrl != null}" th:src="${tournament.imageUrl}"/>
                <span th:unless="${tournament.imageUrl != null}">🏆</span>
            </div>
            <div class="tournament-card-body">
                <div class="tournament-card-title">
                    <a th:href="@{/tournaments/{id}(id=${tournament.id})}" th:text="${tournament.name}"></a>
                </div>
                <div class="tournament-card-meta">
                    <span th:text="${tournament.year}"></span> · <span th:text="${tournament.teams.size()}"></span> squadre
                </div>
                <div class="tournament-card-actions">
                <span sec:authorize="hasAuthority('ADMIN')">
                    <a th:href="@{/admin/tournaments/{id}/edit(id=${tournament.id})}" class="btn btn-sm btn-secondary">Modifica</a>
                    <form th:action="@{/admin/tournaments/{id}/delete(id=${tournament.id})}" method="POST" style="display:inline">
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('Cancellare questo torneo?')">Cancella</button>
                    </form>
                </span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
