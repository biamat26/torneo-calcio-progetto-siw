<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Risultato Partita</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span class="nav-username" th:text="${userDetails?.username}"></span>
        <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="btn btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 500px;">

    <a th:if="${match.tournament != null}"
       th:href="@{/tournaments/{id}/fixtures(id=${match.tournament.id})}"
       class="text-muted" style="font-size: 12px;">← Torna al calendario</a>
    <h1 style="margin-top: 0.25rem;">Inserisci Risultato</h1>

    <!-- Riepilogo partita -->
    <div class="card" style="text-align: center; margin-bottom: 1.5rem;">
        <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;">
            <div style="font-size: 16px; font-weight: 500;" th:text="${match.homeTeam?.name}"></div>
            <div style="font-size: 20px; color: #ccc; font-weight: 700;">vs</div>
            <div style="font-size: 16px; font-weight: 500;" th:text="${match.awayTeam?.name}"></div>
        </div>
        <div class="text-muted" style="margin-top: 0.75rem; font-size: 12px;">
            <span th:text="${#temporals.format(match.dateTime, 'dd/MM/yyyy HH:mm')}"></span>
            · <span th:text="${match.local}"></span>
        </div>
    </div>

    <!-- Form risultato -->
    <div class="card">
        <form th:action="@{/admin/matches/{id}/result(id=${match.id})}" method="POST">
            <div>
                <label th:text="'Gol ' + ${match.homeTeam?.name}">Gol Casa</label>
                <input type="number" name="goalsHome"
                       th:value="${match.goalsHome != null ? match.goalsHome : 0}"
                       min="0" max="99" required />
            </div>
            <div>
                <label th:text="'Gol ' + ${match.awayTeam?.name}">Gol Ospite</label>
                <input type="number" name="goalsAway"
                       th:value="${match.goalsAway != null ? match.goalsAway : 0}"
                       min="0" max="99" required />
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Conferma risultato</button>
                <a th:if="${match.tournament != null}"
                   th:href="@{/tournaments/{id}/fixtures(id=${match.tournament.id})}"
                   class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
