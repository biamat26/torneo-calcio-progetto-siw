<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Nuova Partita</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span class="nav-username" th:text="${userDetails?.username}"></span>
        <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="btn btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 600px;">

    <a th:href="@{/matches}" class="text-muted" style="font-size: 12px;">← Torna alle partite</a>
    <h1 style="margin-top: 0.25rem;">Registra Nuova Partita</h1>

    <div class="card">
        <form th:action="@{/admin/matches}" th:object="${match}" method="POST">
            <div>
                <label>Torneo</label>
                <select name="tournamentId" required>
                    <option value="">-- Seleziona torneo --</option>
                    <option th:each="t : ${tournaments}"
                            th:value="${t.id}"
                            th:text="${t.name}"></option>
                </select>
            </div>
            <div class="form-row">
                <div>
                    <label>Squadra di casa</label>
                    <select name="homeTeamId" required>
                        <option value="">-- Seleziona --</option>
                        <option th:each="t : ${teams}"
                                th:value="${t.id}"
                                th:text="${t.name}"></option>
                    </select>
                </div>
                <div>
                    <label>Squadra ospite</label>
                    <select name="awayTeamId" required>
                        <option value="">-- Seleziona --</option>
                        <option th:each="t : ${teams}"
                                th:value="${t.id}"
                                th:text="${t.name}"></option>
                    </select>
                </div>
            </div>
            <div>
                <label>Arbitro</label>
                <select name="refereeId" required>
                    <option value="">-- Seleziona arbitro --</option>
                    <option th:each="r : ${referees}"
                            th:value="${r.id}"
                            th:text="${r.name} + ' ' + ${r.surname} + ' (' + ${r.referee_code} + ')'"></option>
                </select>
            </div>
            <div>
                <label>Data e ora</label>
                <input type="datetime-local" th:field="*{dateTime}" required />
                <span th:if="${#fields.hasErrors('dateTime')}" th:errors="*{dateTime}" style="color:red;"></span>
            </div>
            <div>
                <label>Luogo</label>
                <input type="text" th:field="*{local}" placeholder="Es. Stadio Olimpico, Roma" required />
                <span th:if="${#fields.hasErrors('local')}" th:errors="*{local}" style="color:red;"></span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Registra partita</button>
                <a th:href="@{/matches}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
