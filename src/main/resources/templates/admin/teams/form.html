<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Nuova Squadra</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span class="nav-username" th:text="${userDetails?.username}"></span>
        <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="btn btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 600px;">

    <a th:href="@{/teams}" class="text-muted" style="font-size: 12px;">← Torna alle squadre</a>
    <h1 style="margin-top: 0.25rem;">Nuova Squadra</h1>

    <div class="card">
        <form th:action="@{/admin/teams}" method="POST"
              th:object="${team}" enctype="multipart/form-data">
            <div>
                <label>Nome</label>
                <input type="text" th:field="*{name}" placeholder="Es. FC Roma" />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red;"></span>
            </div>
            <div>
                <label>Anno fondazione</label>
                <input type="text" th:field="*{foundationYear}" placeholder="Es. 1927" />
            </div>
            <div>
                <label>Città</label>
                <input type="text" th:field="*{city}" placeholder="Es. Roma" />
            </div>
            <div>
                <label>Logo squadra</label>
                <input type="file" name="logo" accept="image/*" />
            </div>
            <div class="form-actions">
                <button type="submit" name="action" value="save" class="btn btn-primary">Crea squadra</button>
                <a th:href="@{/teams}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
