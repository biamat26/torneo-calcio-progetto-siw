<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Nuovo Torneo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span class="nav-username" th:text="${userDetails?.username}"></span>
        <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="btn btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 600px;">

    <a th:href="@{/tournaments}" class="text-muted" style="font-size: 12px;">← Torna ai tornei</a>
    <h1 style="margin-top: 0.25rem;">Nuovo Torneo</h1>

    <div class="card">
        <form th:action="@{/admin/tournaments}" method="POST"
              th:object="${tournament}" enctype="multipart/form-data">
            <div>
                <label>Nome</label>
                <input type="text" th:field="*{name}" placeholder="Es. Serie A 2026" />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red;"></span>
            </div>
            <div>
                <label>Anno</label>
                <input type="text" th:field="*{year}" placeholder="Es. 2026" />
                <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}" style="color:red;"></span>
            </div>
            <div>
                <label>Descrizione</label>
                <textarea th:field="*{description}" placeholder="Descrivi il torneo..."></textarea>
            </div>
            <div>
                <label>Immagine torneo</label>
                <input type="file" name="image" accept="image/*" />
            </div>
            <p class="text-muted" style="font-size: 12px; margin-top: 0.5rem;">
                Le squadre possono essere aggiunte dopo la creazione.
            </p>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Crea torneo</button>
                <a th:href="@{/tournaments}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
