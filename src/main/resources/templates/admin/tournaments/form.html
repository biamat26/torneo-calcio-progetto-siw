<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Inserimento Torneo</title>
</head>
<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/matches}">Partite</a>
    <span th:if="${userDetails}">
        <span th:text="${userDetails.username}"></span>
        <span sec:authorize="hasAuthority('ADMIN')">
            <a th:href="@{/admin/index}">Admin Dashboard</a>
        </span>
        <form th:action="@{/logout}" method="POST">
            <button type="submit">Logout</button>
        </form>
    </span>
    <span th:unless="${userDetails}">
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}">Registrati</a>
    </span>
</nav>

<h1>Aggiungi un torneo</h1>

<form th:action="@{/admin/tournaments}" method="POST" th:object="${tournament}"
      enctype="multipart/form-data">

    <div>
        <label>Nome:</label>
        <input type="text" th:field="*{name}" />
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
    </div>
    <div>
        <label>Anno:</label>
        <input type="text" th:field="*{year}" />
        <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}" style="color:red"></span>
    </div>
    <div>
        <label>Descrizione:</label>
        <input type="text" th:field="*{description}" />
    </div>
    <div>
        <label>Immagine torneo:</label>
        <input type="file" name="image" accept="image/*"/>
    </div>

    <input type="hidden" th:each="t : *{teams}" th:name="teamIds" th:value="${t.id}" />

    <h3>Squadre nel torneo</h3>
    <p th:if="${#lists.isEmpty(tournament.teams)}">Nessuna squadra aggiunta.</p>
    <ul>
        <li th:each="t : *{teams}">
            <span th:text="${t.name}"></span>
            <input type="hidden" name="removeTeamId" th:value="${t.id}"/>
            <button type="submit" name="action" value="removeTeam"
                    th:onclick="|document.querySelector('input[name=teamId]').value=${t.id}|">
                Rimuovi
            </button>
        </li>
    </ul>

    <h3>Aggiungi squadra</h3>
    <select name="teamId">
        <option value="0">-- Seleziona squadra --</option>
        <option th:each="t : ${teams}"
                th:value="${t.id}"
                th:text="${t.name}"
                th:unless="${tournament.teams.contains(t)}"></option>
    </select>
    <button type="submit" name="action" value="addTeam">Aggiungi</button>

    <br/><br/>
    <button type="submit" name="action" value="save">Conferma</button>
    <a th:href="@{/tournaments}">Annulla</a>
</form>
</body>
</html>
