<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Partita</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span th:if="${userDetails}">
            <span class="nav-username" th:text="${userDetails.username}"></span>
            <span sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
            </span>
            <form th:action="@{/logout}" method="POST">
                <button type="submit" class="btn btn-sm">Logout</button>
            </form>
        </span>
        <span th:unless="${userDetails}">
            <a th:href="@{/login}" class="btn btn-sm btn-secondary">Accedi</a>
            <a th:href="@{/register}" class="btn btn-sm btn-primary">Registrati</a>
        </span>
    </div>
</nav>

<div class="container">

    <a th:if="${match.tournament != null}"
       th:href="@{/tournaments/{id}/fixtures(id=${match.tournament.id})}"
       class="text-muted" style="font-size: 12px;">← Torna al calendario</a>

    <!-- Scorecard -->
    <div class="card mt-2" style="text-align: center; padding: 2rem 1.25rem;">

        <div th:if="${match.tournament != null}" style="margin-bottom: 1rem;">
            <span class="badge" th:text="${match.tournament.name}"></span>
        </div>

        <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;">
            <!-- Squadra casa -->
            <div>
                <div style="font-size: 18px; font-weight: 500; color: #1a1a1a;"
                     th:text="${match.homeTeam?.name}"></div>
                <div class="text-muted" style="font-size: 12px; margin-top: 4px;">Casa</div>
            </div>

            <!-- Risultato o VS -->
            <div th:if="${match.state.name() == 'PLAYED'}"
                 style="font-size: 36px; font-weight: 700; color: #1a7a3c; min-width: 100px;">
                <span th:text="${match.goalsHome}"></span>
                <span style="color: #ccc; margin: 0 4px;">–</span>
                <span th:text="${match.goalsAway}"></span>
            </div>
            <div th:unless="${match.state.name() == 'PLAYED'}"
                 style="font-size: 24px; font-weight: 500; color: #ccc; min-width: 100px;">vs</div>

            <!-- Squadra ospite -->
            <div>
                <div style="font-size: 18px; font-weight: 500; color: #1a1a1a;"
                     th:text="${match.awayTeam?.name}"></div>
                <div class="text-muted" style="font-size: 12px; margin-top: 4px;">Ospite</div>
            </div>
        </div>

        <!-- Meta info -->
        <div style="margin-top: 1.5rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
            <span class="text-muted">
                📅 <span th:text="${#temporals.format(match.dateTime, 'dd/MM/yyyy HH:mm')}"></span>
            </span>
            <span class="text-muted">
                📍 <span th:text="${match.local}"></span>
            </span>
            <span class="text-muted" th:if="${match.referee != null}">
                🟨 <span th:text="${match.referee.name + ' ' + match.referee.surname}"></span>
            </span>
        </div>

        <!-- Stato -->
        <div style="margin-top: 1rem;">
            <span class="badge" th:if="${match.state.name() == 'PLAYED'}">Giocata</span>
            <span class="badge badge-gray" th:unless="${match.state.name() == 'PLAYED'}">Programmata</span>
        </div>
    </div>

    <!-- Azioni admin -->
    <span sec:authorize="hasAuthority('ADMIN')">
        <div class="flex mb-2" style="gap: 0.5rem;">
            <a th:href="@{/admin/matches/{id}/result(id=${match.id})}" class="btn btn-sm btn-secondary">
                <span th:if="${match.state.name() == 'PLAYED'}">Modifica risultato</span>
                <span th:unless="${match.state.name() == 'PLAYED'}">Inserisci risultato</span>
            </a>
            <form th:action="@{/admin/matches/{id}/delete(id=${match.id})}"
                  method="POST" style="display: inline;">
                <button type="submit" class="btn btn-sm btn-danger"
                        onclick="return confirm('Eliminare la partita?')">Elimina</button>
            </form>
        </div>
    </span>

    <!-- Commenti -->
    <div class="section-label mt-2">Commenti</div>

    <div class="card" style="padding: 0;" th:unless="${#lists.isEmpty(comments)}">
        <div th:each="c : ${comments}" style="padding: 1rem 1.25rem; border-bottom: 0.5px solid #f0f0f0;">
            <div class="flex justify-between" style="margin-bottom: 0.4rem;">
                <div>
                    <strong style="font-size: 13px;" th:text="${c.author.username}"></strong>
                    <small class="text-muted" style="margin-left: 0.5rem;"
                           th:text="${c.createdAt}"></small>
                </div>
                <span sec:authorize="isAuthenticated()">
                    <div class="flex" style="gap: 0.5rem;"
                         th:if="${c.author.username == #authentication.name}">
                        <a th:href="@{/matches/{mId}/comments/{cId}/edit(mId=${match.id}, cId=${c.id})}"
                           class="btn btn-sm btn-secondary">Modifica</a>
                        <form th:action="@{/matches/{mId}/comments/{cId}/delete(mId=${match.id}, cId=${c.id})}"
                              method="POST" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Eliminare il commento?')">Elimina</button>
                        </form>
                    </div>
                </span>
            </div>
            <p style="font-size: 13px; color: #333; line-height: 1.6;" th:text="${c.text}"></p>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(comments)}" class="text-muted">Nessun commento ancora.</p>

    <!-- Form nuovo commento -->
    <span sec:authorize="isAuthenticated()">
        <div class="card mt-2">
            <h3 style="margin-bottom: 0.75rem;">Lascia un commento</h3>
            <form th:action="@{/matches/{id}/comments(id=${match.id})}"
                  th:object="${newComment}" method="POST">
                <div>
                    <textarea th:field="*{text}" rows="3"
                              maxlength="1000"
                              placeholder="Scrivi il tuo commento..."></textarea>
                    <span th:if="${#fields.hasErrors('text')}"
                          th:errors="*{text}" style="color: red;"></span>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Invia commento</button>
                </div>
            </form>
        </div>
    </span>

    <span sec:authorize="!isAuthenticated()">
        <p class="text-muted mt-2">
            <a th:href="@{/login}">Accedi</a> per lasciare un commento.
        </p>
    </span>

</div>

</body>
</html>
