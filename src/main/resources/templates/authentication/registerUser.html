<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Registrazione — Tornei Calcio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <a th:href="@{/login}" class="btn btn-sm btn-secondary">Accedi</a>
        <a th:href="@{/register}" class="btn btn-sm btn-primary">Registrati</a>
    </div>
</nav>

<div class="container" style="max-width: 480px; padding-top: 3rem;">

    <h1 style="margin-bottom: 0.25rem;">Registrazione</h1>
    <p class="text-muted" style="margin-bottom: 1.5rem;">Crea il tuo account per commentare le partite.</p>

    <div class="card">
        <form th:action="@{/register}" method="POST">

            <div class="form-row">
                <div>
                    <label>Nome</label>
                    <input type="text" required th:field="${user.name}" placeholder="Mario" />
                    <span th:if="${#fields.hasErrors('user.name')}"
                          th:errors="${user.name}" style="color: red;"></span>
                </div>
                <div>
                    <label>Cognome</label>
                    <input type="text" required th:field="${user.surname}" placeholder="Rossi" />
                    <span th:if="${#fields.hasErrors('user.surname')}"
                          th:errors="${user.surname}" style="color: red;"></span>
                </div>
            </div>

            <div>
                <label>Email</label>
                <input type="email" required th:field="${user.email}" placeholder="mario@email.it" />
                <span th:if="${#fields.hasErrors('user.email')}"
                      th:errors="${user.email}" style="color: red;"></span>
            </div>

            <div>
                <label>Username</label>
                <input type="text" required th:field="${credentials.username}" placeholder="mario92" />
                <span th:if="${#fields.hasErrors('credentials.username')}"
                      th:errors="${credentials.username}" style="color: red;"></span>
            </div>

            <div>
                <label>Password</label>
                <input type="password" required th:field="${credentials.password}" />
                <span th:if="${#fields.hasErrors('credentials.password')}"
                      th:errors="${credentials.password}" style="color: red;"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Crea account</button>
            </div>

        </form>
    </div>

    <p class="text-muted" style="text-align: center; margin-top: 1rem;">
        Hai già un account?
        <a th:href="@{/login}">Accedi</a>
    </p>

</div>

</body>
</html>
