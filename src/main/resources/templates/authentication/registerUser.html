<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" >
    <head>
        <title>
            Torneo Calcio - Registrazione
        </title>
    </head>

    <body>


    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/tournaments}">Tornei</a>
        <a th:href="@{/teams}">Squadre</a>
        <a th:href="@{/matches}">Partite</a>
        <span th:if="${userDetails}">
                    <span th:text="${userDetails.username}"></span>
                    <span sec:authorize="hasAuthority('ADMIN')">
                        <a th:href="@{/admin/index}">Admin Dashboard</a>
                    </span>
                    <form th:action="@{/logout}" method = "POST">
                        <button type="submit">Logout</button>
                    </form>
                </span>
        <span th:unless="${userDetails}">
                    <a th:href="@{/login}">Login</a>
                    <a th:href="@{/register}">Registrati</a>
                </span>
    </nav>
    </header>

        <h1>Registrazione nuovo utente</h1>
        <form th:action="@{/register}" method="POST">
            <div>
                <label>Nome</label>
                <span><input type="text" placeholder="name" required th:field="${user.name}"></span>
                <span th:if="${#fields.hasErrors('user.name')}" th:errors="${user.name}" th:style="'color:red'"></span>
            </div>
            <div>
                <label>Cognome</label>
                <span><input type="text" placeholder="surname" required th:field="${user.surname}" /></span>
                <span th:if="${#fields.hasErrors('user.surname')}" th:errors="${user.surname}" th:style="'color:red'"></span>
            </div>
            <div>
                <label>Email</label>
                <span><input type="text" placeholder="email" required th:field="${user.email}" /></span>
                <span th:if="${#fields.hasErrors('user.email')}" th:errors="${user.email}" th:style="'color:red'">
                </span>
            </div>
            <div>
                <label>Username</label>
                <span>
                        <input type="text" placeholder="username" required th:field="${credentials.username}" />
                    </span>
                <span th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}"
                      th:style="'color:red'">
                    </span>
            </div>

            <div>
                <label>Password</label>
                <span><input type="password" placeholder="password" required th:field="${credentials.password}"/></span>
                <span th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}"
                      th:style="'color:red'">
                </span>
            </div>

            <div>
                <button type="submit">Registra</button>
            </div>
        </form>
    </body>

</html>
