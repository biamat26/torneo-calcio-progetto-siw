<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Login — Tornei Calcio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <a th:href="@{/login}" class="btn btn-sm btn-secondary">Accedi</a>
        <a th:href="@{/register}" class="btn btn-sm btn-primary">Registrati</a>
    </div>
</nav>

<div class="container" style="max-width: 420px; padding-top: 3rem;">

    <h1 style="margin-bottom: 0.25rem;">Accedi</h1>
    <p class="text-muted" style="margin-bottom: 1.5rem;">Bentornato su Tornei Calcio.</p>

    <div th:if="${param.error != null}" class="alert alert-error" style="margin-bottom: 1rem;">
        Username o password errati. Riprova.
    </div>

    <div class="card">
        <form th:action="@{/login}" method="POST">
            <div>
                <label>Username</label>
                <input name="username" type="text" required autocomplete="username" />
            </div>
            <div>
                <label>Password</label>
                <input name="password" type="password" required autocomplete="current-password" />
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Accedi</button>
            </div>
        </form>
    </div>

    <p class="text-muted" style="text-align: center; margin-top: 1rem;">
        Non hai un account?
        <a th:href="@{/register}">Registrati</a>
    </p>

</div>

</body>
</html>
