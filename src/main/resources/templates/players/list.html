<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Giocatori</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span th:if="${userDetails}">
            <span class="nav-username" th:text="${userDetails.username}"></span>
            <span sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
            </span>
            <form th:action="@{/logout}" method="POST">
                <button type="submit" class="btn btn-sm">Logout</button>
            </form>
        </span>
        <span th:unless="${userDetails}">
            <a th:href="@{/login}" class="btn btn-sm btn-secondary">Accedi</a>
            <a th:href="@{/register}" class="btn btn-sm btn-primary">Registrati</a>
        </span>
    </div>
</nav>

<div class="container">

    <div class="flex justify-between mb-2">
        <h1 style="margin-bottom: 0;">Giocatori</h1>
        <span sec:authorize="hasAuthority('ADMIN')">
            <a th:href="@{/admin/players/new}" class="btn btn-primary">+ Nuovo giocatore</a>
        </span>
    </div>

    <p th:if="${#lists.isEmpty(players)}" class="text-muted">Nessun giocatore registrato.</p>

    <div class="tournament-card-grid">
        <div th:each="player : ${players}" class="tournament-card">
            <div class="tournament-card-img">
                <img th:if="${player.photoUrl != null}" th:src="${player.photoUrl}"
                     style="width: 100%; height: 100%; object-fit: contain; padding: 12px;" />
                <span th:unless="${player.photoUrl != null}">👤</span>
            </div>
            <div class="tournament-card-body">
                <div class="tournament-card-title">
                    <a th:href="@{/players/{id}(id=${player.id})}"
                       th:text="${player.name} + ' ' + ${player.surname}"></a>
                </div>
                <div class="tournament-card-meta">
                    <span class="badge" th:text="${player.role}"></span>
                    <span th:if="${player.team != null}"
                          class="text-muted" style="margin-left: 4px;"
                          th:text="${player.team.name}"></span>
                </div>
                <div class="tournament-card-actions">
                    <span sec:authorize="hasAuthority('ADMIN')">
                        <a th:href="@{/admin/players/{id}/edit(id=${player.id})}"
                           class="btn btn-sm btn-secondary">Modifica</a>
                        <form th:action="@{/admin/players/{id}/delete(id=${player.id})}"
                              method="POST" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Eliminare il giocatore?')">Elimina</button>
                        </form>
                    </span>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
