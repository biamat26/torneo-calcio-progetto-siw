<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Giocatori</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
</head>
<body>

<nav>
    <span class="nav-logo">⚽ Tornei Calcio</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/tournaments}">Tornei</a>
    <a th:href="@{/teams}">Squadre</a>
    <a th:href="@{/players}">Giocatori</a>
    <a th:href="@{/matches}">Partite</a>
    <div class="nav-right">
        <span th:if="${userDetails}">
            <span class="nav-username" th:text="${userDetails.username}"></span>
            <span sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/admin/index}" class="btn btn-sm btn-secondary">Admin</a>
            </span>
            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button type="submit" class="btn btn-sm">Logout</button>
            </form>
        </span>
        <span th:unless="${userDetails}">
            <a th:href="@{/login}" class="btn btn-sm btn-secondary">Accedi</a>
            <a th:href="@{/register}" class="btn btn-sm btn-primary">Registrati</a>
        </span>
    </div>
</nav>

<div class="container">
    <div class="flex justify-between mb-2">
        <h1 style="margin-bottom: 0;">Giocatori</h1>
        <span sec:authorize="hasAuthority('ADMIN')">
            <a th:href="@{/admin/players/new}" class="btn btn-primary">+ Nuovo giocatore</a>
        </span>
    </div>
    <div id="root"></div>
</div>

<script type="text/babel" data-presets="react" th:inline="none">
    const { useState, useEffect } = React;

    const ROLES = ['GOALKEEPER', 'DEFENDER', 'MIDFIELDER', 'STRIKER'];

    const ROLE_LABELS = {
        GOALKEEPER: 'Portiere',
        DEFENDER:   'Difensore',
        MIDFIELDER: 'Centrocampista',
        STRIKER:    'Attaccante',
    };

    function PlayerCard({ player }) {
        const playerUrl = '/players/' + player.id;
        const altText = (player.name || '') + ' ' + (player.surname || '');

        return (
            <div className='tournament-card'>
                <div className='tournament-card-img'>
                    {player.photoUrl
                        ? <img src={player.photoUrl} alt={altText} />
                        : <span>👤</span>
                    }
                </div>
                <div className='tournament-card-body'>
                    <div className='tournament-card-title'>
                        <a href={playerUrl}>{player.name} {player.surname}</a>
                    </div>
                    <div className='tournament-card-meta'>
                        <span className='badge'>{ROLE_LABELS[player.role] || player.role}</span>
                        {player.teamName
                            ? <span className='text-muted'>{player.teamName}</span>
                            : null
                        }
                    </div>
                </div>
            </div>
        );
    }

    function PlayerList() {
        const [players, setPlayers] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error,   setError]   = useState(null);
        const [search,  setSearch]  = useState('');
        const [role,    setRole]    = useState('');

        useEffect(function() {
            fetch('/api/players')
                .then(function(res) {
                    if (!res.ok) throw new Error('Errore nel caricamento dei giocatori');
                    return res.json();
                })
                .then(function(data) {
                    setPlayers(Array.isArray(data) ? data : []);
                    setLoading(false);
                })
                .catch(function(err) {
                    setError(err.message);
                    setLoading(false);
                });
        }, []);

        if (loading) return <p className='text-muted'>Caricamento giocatori...</p>;
        if (error)   return <p className='text-muted'>{error}</p>;

        const filtered = players.filter(function(p) {
            const matchesSearch = ((p.name || '') + ' ' + (p.surname || ''))
                .toLowerCase()
                .includes(search.toLowerCase());
            const matchesRole = role === '' || p.role === role;
            return matchesSearch && matchesRole;
        });

        return (
            <div>
                <div className='flex mb-2'>
                    <input
                        className='player-search'
                        type='text'
                        placeholder='Cerca per nome...'
                        value={search}
                        onChange={function(e) { setSearch(e.target.value); }}
                    />
                    <select
                        className='player-role-select'
                        value={role}
                        onChange={function(e) { setRole(e.target.value); }}
                    >
                        <option value=''>Tutti i ruoli</option>
                        {ROLES.map(function(r) {
                            return <option key={r} value={r}>{ROLE_LABELS[r]}</option>;
                        })}
                    </select>
                    <span className='text-muted'>{filtered.length} giocatori trovati</span>
                </div>

                {filtered.length === 0
                    ? <p className='text-muted'>Nessun giocatore trovato.</p>
                    : <div className='tournament-card-grid'>
                        {filtered.map(function(p) {
                            return <PlayerCard key={p.id} player={p} />;
                        })}
                    </div>
                }
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PlayerList />);
</script>

</body>
</html>
