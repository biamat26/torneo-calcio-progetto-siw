spring.application.name=torneo-calcio
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/torneo_calcio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html

# SQL init
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Messages
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Static resources
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/

# Logging
logging.level.root=INFO
logging.level.it.uniroma3.siw.torneo_calcio=DEBUG